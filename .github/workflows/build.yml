name: Build & Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-installer:
    name: Build ProFlow (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static export
        run: pnpm exec next build

      - name: Verify build output
        shell: bash
        run: |
          if [ ! -f out/index.html ]; then
            echo "::error::out/index.html missing"
            exit 1
          fi
          echo "Build OK: $(wc -c < out/index.html) bytes"

      - name: Build installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: pnpm exec electron-builder --win --publish always

      - name: Upload stable installer
        shell: bash
        run: |
          INSTALLER=$(ls release/ProFlow-Setup-*.exe 2>/dev/null | head -1)
          if [ -n "$INSTALLER" ]; then
            cp "$INSTALLER" release/ProFlow-Setup.exe
          fi

      - name: Attach stable installer
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: release/ProFlow-Setup.exe

  build-apk:
    name: Build ProFlow APK
    needs: build-installer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static export
        run: pnpm exec next build

      - name: Verify build output
        shell: bash
        run: test -f out/index.html && echo "OK"

      - name: Sync Android assets
        run: |
          rm -rf android/app/src/main/assets/public
          cp -r out android/app/src/main/assets/public
          echo 'Copied out/ to Android assets'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Debug environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME/platforms/" 2>/dev/null || echo "No platforms dir"
          ls -la app/proflow-release.keystore 2>/dev/null || echo "Keystore missing"
          cat local.properties 2>/dev/null || echo "No local.properties"

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          cat android/local.properties

      - name: Build APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: app/proflow-release.keystore
          ANDROID_KEYSTORE_PASSWORD: ProFlowRelease2025
          ANDROID_KEY_ALIAS: proflow
          ANDROID_KEY_PASSWORD: ProFlowRelease2025
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 | tail -100

      - name: Verify APK exists
        if: success()
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$APK" ]; then
            echo "APK not found at $APK — searching..."
            find android -name '*.apk' 2>/dev/null
            exit 1
          fi
          ls -la "$APK"

      - name: Upload APK to release
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.ref_name }} android/app/build/outputs/apk/release/app-release.apk --clobber
