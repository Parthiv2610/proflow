name: Build Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-apk:
    name: Build ProFlow APK (Android)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fresh source
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Release tags must match package.json version, or we'd ship a mismatched build.
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF#refs/tags/}"
          EXPECTED="v${VERSION}"
          echo "package.json version: ${EXPECTED} | tag: ${TAG}"
          if [ "${TAG}" != "${EXPECTED}" ]; then
            echo "::error::Tag ${TAG} does not match package.json version ${EXPECTED}. Bump package.json first."
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Same config swap build.bat does locally: dev config is committed, export
      # config is written for the build so the static export lands in out/.
      - name: Build static export (fresh, never stale)
        shell: bash
        run: |
          cp next.config.mjs next.config.mjs.dev
          cat > next.config.mjs <<'EOF'
          /** @type {import('next').NextConfig} */
          const nextConfig = {
            output: "export",
            distDir: "out",
            typescript: { ignoreBuildErrors: true },
            images: { unoptimized: true },
            assetPrefix: "./",
            trailingSlash: true,
          }
          export default nextConfig
          EOF
          pnpm exec next build
          cp next.config.mjs.dev next.config.mjs
          rm -f next.config.mjs.dev

      # Hydration guard — same protection as the desktop installer workflow.
      - name: Hydration guard (fail if export is a dead shell)
        shell: bash
        run: |
          if [ ! -f out/index.html ]; then
            echo "::error::out/index.html missing - build produced nothing"
            exit 1
          fi
          # The not-found boundary flight data is a NORMAL part of every Next
          # export - do NOT grep for it. The real signals of a healthy export:
          # RSC flight data present + the app shell marker + JS chunks on disk.
          if ! grep -q "self.__next_f" out/index.html; then
            echo "::error::No RSC flight data in out/index.html - React will never hydrate"
            exit 1
          fi
          if ! grep -q "ProFlow" out/index.html; then
            echo "::error::App shell marker missing from out/index.html"
            exit 1
          fi
          CHUNKS=$(ls out/_next/static/chunks/*.js 2>/dev/null | wc -l)
          if [ "${CHUNKS}" -lt 1 ]; then
            echo "::error::No JS chunks under out/_next/static/chunks"
            exit 1
          fi
          echo "OK: index.html is hydrated-ready with ${CHUNKS} JS chunks"

      - name: Sync web assets into the Android project
        run: pnpm exec cap sync android

      # Signed release APK — keystore.properties is committed for convenience,
      # but the workflow also honors ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_PASSWORD
      # secrets so the signing password can be kept out of the repo entirely.
      - name: Build signed release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Verify APK artifact is signed
        shell: bash
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          ls -la android/app/build/outputs/apk/release/
          if [ ! -f "${APK}" ]; then
            echo "::error::No app-release.apk produced by Gradle"
            exit 1
          fi
          SIZE=$(stat -c%s "${APK}" 2>/dev/null || echo 0)
          echo "APK: ${APK} (${SIZE} bytes)"
          if [ "${SIZE}" -lt 1000000 ]; then
            echo "::error::APK suspiciously small (${SIZE} bytes) - build likely failed"
            exit 1
          fi
          # The release APK must be signed. With minSdk 24 AGP uses APK Signature
          # Scheme v2/v3 (no META-INF block), so use apksigner — the canonical check.
          APKSIGNER=$(ls ${ANDROID_HOME}/build-tools/*/apksigner 2>/dev/null | tail -1)
          if [ -z "${APKSIGNER}" ]; then
            echo "::error::apksigner not found in Android build-tools"
            exit 1
          fi
          if ! "${APKSIGNER}" verify --print-certs "${APK}" 2>&1 | tee /tmp/apk-certs.txt; then
            echo "::error::APK signature verification FAILED"
            exit 1
          fi
          echo "OK: APK is properly signed (v1/v2/v3 verified by apksigner)"

      - name: Upload APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/app-release.apk
          fail_on_unmatched_files: true
