name: Build Windows Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-installer:
    name: Build ProFlow-Setup (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout fresh source
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Release tags must match package.json version, or we'd ship a mismatched build.
      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF#refs/tags/}"
          EXPECTED="v${VERSION}"
          echo "package.json version: ${EXPECTED} | tag: ${TAG}"
          if [ "${TAG}" != "${EXPECTED}" ]; then
            echo "::error::Tag ${TAG} does not match package.json version ${EXPECTED}. Bump package.json first."
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Same config swap build.bat does locally: dev config is committed, export
      # config is written for the build so the static export lands in out/.
      - name: Build static export (fresh, never stale)
        shell: bash
        run: |
          cp next.config.mjs next.config.mjs.dev
          cat > next.config.mjs <<'EOF'
          /** @type {import('next').NextConfig} */
          const nextConfig = {
            output: "export",
            distDir: "out",
            typescript: { ignoreBuildErrors: true },
            images: { unoptimized: true },
            assetPrefix: "./",
            trailingSlash: true,
          }
          export default nextConfig
          EOF
          pnpm exec next build
          cp next.config.mjs.dev next.config.mjs
          rm -f next.config.mjs.dev

      # Guards against the stale-build blank-screen bug: a corrupt export is the
      # 404 shell and React never hydrates. Fail the build instead of shipping it.
      - name: Hydration guard (fail if export is a dead shell)
        shell: bash
        run: |
          if [ ! -f out/index.html ]; then
            echo "::error::out/index.html missing - build produced nothing"
            exit 1
          fi
          # The not-found boundary flight data is a NORMAL part of every Next
          # export - do NOT grep for it. The real signals of a healthy export:
          # RSC flight data present + the app shell marker + JS chunks on disk.
          if ! grep -q "self.__next_f" out/index.html; then
            echo "::error::No RSC flight data in out/index.html - React will never hydrate"
            exit 1
          fi
          if ! grep -q "ProFlow" out/index.html; then
            echo "::error::App shell marker missing from out/index.html"
            exit 1
          fi
          CHUNKS=$(ls out/_next/static/chunks/*.js 2>/dev/null | wc -l)
          if [ "${CHUNKS}" -lt 1 ]; then
            echo "::error::No JS chunks under out/_next/static/chunks"
            exit 1
          fi
          echo "OK: index.html is hydrated-ready with ${CHUNKS} JS chunks"

      - name: Package installer (electron-builder NSIS)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: pnpm exec electron-builder --win --publish never

      - name: Verify installer artifact
        shell: bash
        run: |
          ls -la release/
          INSTALLER=$(ls release/ProFlow-Setup-*.exe 2>/dev/null | head -1)
          if [ -z "${INSTALLER}" ]; then
            echo "::error::No ProFlow-Setup-*.exe produced by electron-builder"
            exit 1
          fi
          SIZE=$(stat -c%s "${INSTALLER}" 2>/dev/null || echo 0)
          echo "Installer: ${INSTALLER} (${SIZE} bytes)"
          if [ "${SIZE}" -lt 50000000 ]; then
            echo "::error::Installer suspiciously small (${SIZE} bytes) - packaging likely failed"
            exit 1
          fi

      - name: Upload installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/ProFlow-Setup-*.exe
          fail_on_unmatched_files: true
